<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Your Talk Title</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">

  <link rel="stylesheet" href="assets/deck.css">
</head>

<body>

<!--
  ──────────────────────────────────────────────────────────────────────────
  Modular Reveal.js deck — host this folder, that's the whole setup.

      python3 -m http.server 8000
      open http://127.0.0.1:8000/<this-folder>/

  Slide order      → manifest.json
  Slide content    → content/<chapter>/<folio>-<slug>.html
  Theme / type     → assets/deck.css :root tokens
  Validate edits   → python3 bin/check.py

  No plugin, no build step. Plain Reveal.js 5 + native fetch + ES modules.
  ──────────────────────────────────────────────────────────────────────────
-->

<div class="reveal">
  <div class="slides">
    <!-- slides injected here at load by the inline module below -->
  </div>
</div>

<!-- Reveal core + speaker-notes plugin (CDN, pinned to 5.1.0) -->
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

<!-- Interactive slide widgets: defines window.deckWidgets + window.deckWidgetsInit. -->
<!-- Slides reference widgets declaratively via data-widget="…". No inline scripts. -->
<script src="assets/widgets.js"></script>

<script type="module">
  // ── Load every slide listed in manifest.json into .slides ───────────────
  const slidesEl = document.querySelector('.reveal .slides');

  try {
    const manifest = await (await fetch('./manifest.json')).json();

    for (const slide of manifest.slides) {
      const res = await fetch(slide.path);
      if (!res.ok) {
        console.error(`[deck] ${slide.path} → ${res.status}`);
        continue;
      }
      // Skip the leading slide-meta comment by starting at the first <section>.
      const text = await res.text();
      const start = text.indexOf('<section');
      slidesEl.insertAdjacentHTML('beforeend', start >= 0 ? text.slice(start) : text);
    }
  } catch (err) {
    console.error('[deck] load failed:', err);
    document.body.insertAdjacentHTML('afterbegin',
      `<pre style="position:fixed;inset:0;color:#fff;background:#a00;padding:32px;font:14px ui-monospace,monospace;z-index:9999;white-space:pre-wrap">
[deck] failed to load slides.

This deck must be served over HTTP — fetch() does not work on file:// URIs.
From the repo root:

    python3 -m http.server 8000
    open http://127.0.0.1:8000/<this-folder>/

Underlying error: ${err.message}
</pre>`);
    throw err;
  }

  // ── Initialise interactive widgets BEFORE Reveal renders. ───────────────
  // Each [data-widget] marker in slide HTML maps to a factory in widgets.js.
  // Doing this pre-init means widgets paint correctly on the very first slide
  // and the demo state is live the moment the user lands on it.
  if (typeof window.deckWidgetsInit === 'function') {
    window.deckWidgetsInit(slidesEl);
  }

  // ── Hand off to Reveal. initialize() returns a Promise per Reveal docs. ──
  // Keep this minimal: every option below is load-bearing. Add more only
  // if you actually need the behaviour they unlock.
  await Reveal.initialize({
    width: 1280, height: 720, margin: 0,
    center: false, transition: 'fade',
    hash: true,
    slideNumber: 'c/t', showSlideNumber: 'speaker',
    overview: true, help: true,
    plugins: [ RevealNotes ],
  });
</script>

</body>
</html>
